# Generated by /cenci:configure — per-repo lazyboards board config.
# Bindings below are listed verbatim rather than inherited, so they don't
# depend on a personal global config — but global entries for keys not
# listed here still merge in (see the "Merge and precedence" note under
# README's Keymaps section).
columns:
  - name: New
  - name: Refined
  - name: Planned
  - name: In Review

keymaps:
  # Board-level actions (default scope is "card" — they act on the selected
  # card), mirrored into both normal mode and the detail panel so they still
  # dispatch while the detail panel is focused.
  normal:
    C: { name: Claude, type: shell, command: "tmux new-window cenci open --agent claude" }
    X: { name: Codex, type: shell, command: "tmux new-window cenci open --agent codex" }
  detail:
    C: { name: Claude, type: shell, command: "tmux new-window cenci open --agent claude" }
    X: { name: Codex, type: shell, command: "tmux new-window cenci open --agent codex" }

  columns:
    New:
      R:
        {
          name: Refine,
          type: shell,
          command: "cenci run refine {number} --model sonnet -- {comment}",
        }

    Refined:
      I:
        {
          name: Implement,
          type: shell,
          command: "cenci run implement {number} --model sonnet -- {comment}",
        }

    Planned:
      I:
        {
          name: Implement,
          type: shell,
          command: "cenci run implement {number} --model sonnet -- {comment}",
        }
      E:
        {
          name: Edit plan,
          type: shell,
          command: 'f=$(ls .plans/{number}-*.md 2>/dev/null | head -1); [ -n "$f" ] && tmux new-window -n plan-{number} "$EDITOR \"$f\""',
        }
      V:
        {
          name: View plan,
          type: shell,
          command: 'f=$(ls .plans/{number}-*.md 2>/dev/null | head -1); [ -n "$f" ] && tmux new-window -n plan-{number} "${PAGER:-less} \"$f\""',
        }

    In Review:
      # window:/cwd: let lazyboards build (and escape) the tmux invocation;
      # terminal: hands this terminal to the command instead, for the one
      # that's worth watching to completion.
      W:
        {
          name: Open worktree,
          type: shell,
          scope: pr,
          window: "pr-{pr_number}",
          cwd: "{pr_worktree}",
        }
      S:
        {
          name: Serve worktree,
          type: shell,
          scope: pr,
          window: "pr-{pr_number}",
          cwd: "{pr_worktree}",
          command: "go run .",
        }
      T:
        {
          name: Test worktree,
          type: shell,
          scope: pr,
          cwd: "{pr_worktree}",
          terminal: true,
          command: "go test ./...",
        }

# Auto-close a card's agent window when its ticket closes
cleanup: "cenci close {number}"
