# Generated by /cenci:configure — per-repo lazyboards board config. This file
# is self-contained and needs no other config: a local `columns:` list REPLACES
# the global column list entirely — it never merges — and every key binding
# below lives in the `keymaps:` namespace.
#
# Actions use lazyboards' own run-mode fields rather than hand-written tmux
# strings: `window:` opens a tmux window (detached unless `focus: true`),
# `cwd:` sets the working directory, and `terminal: true` hands this terminal
# to the command for the ones worth watching to completion. lazyboards builds
# and whole-token-escapes those invocations itself — see docs/keymaps.md and
# docs/shell-and-url-safety.md.
columns:
  - name: New
  - name: Refined
  - name: Planned
  - name: In Review

keymaps:
  # Board-level agent launchers. Emitted in BOTH tables so they fire whether the
  # card list or the detail panel is focused. Each gets a focused tmux window of
  # its own, since an agent session outlives the keypress.
  normal:
    C:
      {
        name: Claude,
        type: shell,
        window: claude,
        focus: true,
        command: "cenci open --agent claude",
      }
    X:
      {
        name: Codex,
        type: shell,
        window: codex,
        focus: true,
        command: "cenci open --agent codex",
      }
  detail:
    C:
      {
        name: Claude,
        type: shell,
        window: claude,
        focus: true,
        command: "cenci open --agent claude",
      }
    X:
      {
        name: Codex,
        type: shell,
        window: codex,
        focus: true,
        command: "cenci open --agent codex",
      }

  # Per-column overlays — these apply to normal + detail only, matched
  # case-insensitively against the column names declared above.
  columns:
    New:
      R:
        name: Refine
        type: shell
        command: "cenci run refine {number}"

    Refined:
      I:
        name: Implement
        type: shell
        command: "cenci run implement {number}"

    Planned:
      I:
        name: Implement
        type: shell
        command: "cenci run implement {number}"
      # Plan files are .plans/<number>-<slug>.md and the slug isn't derivable
      # from the number, so both actions glob for it and no-op when the plan
      # has already been consumed. terminal: true gives $EDITOR/$PAGER this
      # terminal directly, which is what an interactive editor wants.
      E:
        name: Edit plan
        type: shell
        terminal: true
        command: 'f=$(ls .plans/{number}-*.md 2>/dev/null | head -1); [ -n "$f" ] && $EDITOR "$f"'
      V:
        name: View plan
        type: shell
        terminal: true
        command: 'f=$(ls .plans/{number}-*.md 2>/dev/null | head -1); [ -n "$f" ] && ${PAGER:-less} "$f"'

    "In Review":
      # {pr_worktree} resolves the PR branch's registered git worktree at
      # dispatch time, so these stay machine-independent.
      W:
        name: Open worktree
        type: shell
        scope: pr
        window: "pr-{pr_number}"
        cwd: "{pr_worktree}"
      S:
        name: Serve worktree
        type: shell
        scope: pr
        window: "pr-{pr_number}"
        cwd: "{pr_worktree}"
        command: "go run ."
      T:
        name: Test worktree
        type: shell
        scope: pr
        cwd: "{pr_worktree}"
        terminal: true
        command: "go test ./..."

# Auto-close a card's agent window when its ticket closes. `cleanup` stays a
# top-level scalar — it is not a key binding and has no place in `keymaps:`.
cleanup: "cenci close {number}"
